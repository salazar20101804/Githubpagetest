<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
    <div class="overlay">
        <h1>🌸 Anime World 🌸</h1>
        <p>Comparte tus imágenes, fanarts y contenido favorito</p>
        <a href="#subir" class="btn">Comenzar</a>
    </div>
</header>

<section class="contenido">
    <h2>Bienvenido</h2>
    <p>
        Una comunidad para compartir anime, manga,
        ilustraciones y contenido creado por fans.
    </p>
</section>

<section id="subir" class="upload">
    <h2>Subir Contenido</h2>

    <form>
        <input type="text" placeholder="Título de la publicación" required>

        <textarea
            placeholder="Describe tu publicación..."
            rows="5"
            required></textarea>

        <input type="file" accept="image/*,video/*">

        <button type="submit">Publicar</button>
    </form>
</section>

<footer>
    <p>© 2026 Anime World</p>
</footer>

</body>
</html>
